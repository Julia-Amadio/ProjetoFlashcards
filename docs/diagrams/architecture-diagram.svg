<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 840" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1400" height="840" fill="#ffffff"/>
  <text x="20" y="30" font-size="20" font-weight="700" fill="#1a1a1a">Karta — Diagrama de Componentes / Deployment</text>

  <!-- ============ Browser ============ -->
  <rect x="540" y="55" width="260" height="70" rx="8" fill="#fff7e6" stroke="#c8871a" stroke-width="1.5"/>
  <text x="670" y="82" text-anchor="middle" font-size="13.5" font-weight="700">Navegador (Cliente)</text>
  <text x="670" y="102" text-anchor="middle" font-size="11.5" fill="#555">quem estuda ou administra</text>

  <!-- ============ Vercel node ============ -->
  <rect x="480" y="190" width="380" height="120" rx="6" fill="none" stroke="#666" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="495" y="207" font-size="11" fill="#666" font-style="italic">«nó de hospedagem» Vercel</text>
  <rect x="510" y="220" width="320" height="70" rx="6" fill="#e8f0fe" stroke="#2a5db0" stroke-width="1.5"/>
  <text x="670" y="248" text-anchor="middle" font-size="13" font-weight="700">Frontend</text>
  <text x="670" y="266" text-anchor="middle" font-size="11.5" fill="#333">React + TypeScript + Vite — build estático</text>
  <text x="670" y="281" text-anchor="middle" font-size="10.5" fill="#666">(HTML/JS/CSS, sem servidor Node em runtime)</text>

  <!-- ============ Render node: backend ============ -->
  <rect x="60" y="380" width="340" height="150" rx="6" fill="none" stroke="#666" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="75" y="397" font-size="11" fill="#666" font-style="italic">«nó de hospedagem» Render</text>
  <rect x="90" y="410" width="280" height="100" rx="6" fill="#e8f7ea" stroke="#1f8a3d" stroke-width="1.5"/>
  <text x="230" y="435" text-anchor="middle" font-size="13" font-weight="700">Backend</text>
  <text x="230" y="453" text-anchor="middle" font-size="11.5" fill="#333">Spring Boot (Java 21)</text>
  <text x="230" y="470" text-anchor="middle" font-size="10.5" fill="#666">JWT, Spring Security, JPA/Hibernate,</text>
  <text x="230" y="484" text-anchor="middle" font-size="10.5" fill="#666">Flyway · GET /health · porta dinâmica (PORT)</text>

  <!-- ============ Render node: python-services ============ -->
  <rect x="440" y="380" width="340" height="150" rx="6" fill="none" stroke="#666" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="455" y="397" font-size="11" fill="#666" font-style="italic">«nó de hospedagem» Render</text>
  <rect x="470" y="410" width="280" height="100" rx="6" fill="#e8f7ea" stroke="#1f8a3d" stroke-width="1.5"/>
  <text x="610" y="435" text-anchor="middle" font-size="13" font-weight="700">python-services</text>
  <text x="610" y="453" text-anchor="middle" font-size="11.5" fill="#333">FastAPI (Python 3.12)</text>
  <text x="610" y="470" text-anchor="middle" font-size="10.5" fill="#666">GET /health · POST /generate (X-Internal-Token)</text>
  <text x="610" y="484" text-anchor="middle" font-size="10.5" fill="#666">stateless, satélite do backend</text>

  <!-- ============ Neon node ============ -->
  <rect x="60" y="600" width="340" height="110" rx="6" fill="none" stroke="#666" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="75" y="617" font-size="11" fill="#666" font-style="italic">«nó de hospedagem» Neon (cloud)</text>
  <rect x="90" y="630" width="280" height="60" rx="6" fill="#f3e8fd" stroke="#7a2ec2" stroke-width="1.5"/>
  <text x="230" y="656" text-anchor="middle" font-size="13" font-weight="700">PostgreSQL 17</text>
  <text x="230" y="675" text-anchor="middle" font-size="10.5" fill="#666">único banco — sem Postgres local, nenhum cenário</text>

  <!-- ============ External APIs node ============ -->
  <rect x="440" y="600" width="340" height="190" rx="6" fill="none" stroke="#666" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="455" y="617" font-size="11" fill="#666" font-style="italic">APIs externas de terceiros</text>
  <rect x="470" y="630" width="280" height="42" rx="6" fill="#fdeeee" stroke="#b03a3a" stroke-width="1.3"/>
  <text x="610" y="656" text-anchor="middle" font-size="12" font-weight="700">OpenAI — modelo gpt-5</text>
  <rect x="470" y="680" width="280" height="42" rx="6" fill="#fdeeee" stroke="#b03a3a" stroke-width="1.3"/>
  <text x="610" y="706" text-anchor="middle" font-size="12" font-weight="700">Pexels — busca de imagem</text>
  <rect x="470" y="730" width="280" height="42" rx="6" fill="#fdeeee" stroke="#b03a3a" stroke-width="1.3"/>
  <text x="610" y="756" text-anchor="middle" font-size="12" font-weight="700">Edge-TTS (Microsoft) — áudio</text>

  <!-- ============ Connections ============ -->

  <!-- Browser <-> Vercel: static assets -->
  <line x1="640" y1="125" x2="640" y2="220" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#arr)"/>
  <text x="510" y="175" font-size="11">serve HTML/JS/CSS (build estático)</text>

  <!-- Browser -> Backend: fetch direto (nao passa pelo Vercel) -->
  <path d="M 600 125 C 380 220, 260 300, 230 410" fill="none" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="235" y="330" font-size="11">fetch direto, HTTPS</text>
  <text x="235" y="345" font-size="11">Authorization: Bearer &lt;JWT&gt;</text>
  <text x="200" y="365" font-size="11" fill="#b03a3a" font-weight="700">⚠ requer CORS liberado (pendente)</text>

  <!-- Backend -> Neon -->
  <line x1="230" y1="510" x2="230" y2="630" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="240" y="575" font-size="11">JDBC + SSL</text>
  <text x="240" y="590" font-size="11">(Flyway migra, Hibernate consulta)</text>

  <!-- Backend -> python-services -->
  <line x1="370" y1="460" x2="470" y2="460" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="375" y="445" font-size="11">POST /generate</text>
  <text x="375" y="500" font-size="11">X-Internal-Token</text>

  <!-- python-services -> external apis -->
  <line x1="610" y1="510" x2="610" y2="630" stroke="#1a1a1a" stroke-width="1.4" marker-end="url(#arr)"/>
  <text x="620" y="575" font-size="11">HTTPS</text>

  <!-- ============ Legend ============ -->
  <rect x="1010" y="600" width="330" height="190" fill="#fafafa" stroke="#999" stroke-width="1"/>
  <text x="1025" y="622" font-size="12.5" font-weight="700">Legenda</text>
  <rect x="1025" y="632" width="16" height="16" fill="#e8f0fe" stroke="#2a5db0"/>
  <text x="1048" y="645" font-size="11.5">Frontend (Vercel)</text>
  <rect x="1025" y="655" width="16" height="16" fill="#e8f7ea" stroke="#1f8a3d"/>
  <text x="1048" y="668" font-size="11.5">Serviços Java/Python (Render)</text>
  <rect x="1025" y="678" width="16" height="16" fill="#f3e8fd" stroke="#7a2ec2"/>
  <text x="1048" y="691" font-size="11.5">Banco de dados (Neon)</text>
  <rect x="1025" y="701" width="16" height="16" fill="#fdeeee" stroke="#b03a3a"/>
  <text x="1048" y="714" font-size="11.5">APIs de terceiros</text>
  <text x="1025" y="740" font-size="11" fill="#555">Tracejado = fronteira de hospedagem</text>
  <text x="1025" y="756" font-size="11" fill="#555">(nó/plataforma), não um componente</text>
  <text x="1025" y="775" font-size="11" fill="#b03a3a">⚠ = pendência real, não implementada</text>

  <text x="20" y="825" font-size="11" fill="#777">Reflete o estado real do deploy desta sessão (Render + Vercel + Neon) — Karta, ProjetoFlashcards</text>
</svg>
