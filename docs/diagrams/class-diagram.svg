<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="DejaVu Sans, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#17352d" flood-opacity=".12"/>
    </filter>
    <marker id="diamond" viewBox="0 0 12 12" refX="11" refY="6" markerWidth="10" markerHeight="10" orient="auto">
      <path d="M1 6 L6 1 L11 6 L6 11 Z" fill="#fff" stroke="#315e51" stroke-width="1.4"/>
    </marker>
    <style>
      .box{fill:#fff;stroke:#315e51;stroke-width:1.6;filter:url(#shadow)}
      .head{fill:#315e51}
      .assoc{fill:#fffaf5;stroke:#c66555}
      .line{fill:none;stroke:#59716a;stroke-width:1.7}
      .name{font-size:17px;font-weight:700;fill:#fff}
      .stereo{font-size:11px;fill:#dce9e5}
      .field{font-size:13px;fill:#23332f}
      .note{font-size:11.5px;fill:#6d7b77}
      .mult{font-size:12px;font-weight:700;fill:#315e51}
      .label{font-size:12px;font-style:italic;fill:#526660}
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#f6f4ee"/>
  <rect x="0" y="0" width="1600" height="58" fill="#213f37"/>
  <text x="34" y="36" font-size="22" font-weight="700" fill="#fff">Karta — Diagrama de Classes do Domínio</text>
  <text x="1565" y="35" text-anchor="end" font-size="12" fill="#cbdad5">Backend + modelo persistido</text>

  <!-- User -->
  <g>
    <rect class="box" x="40" y="95" width="300" height="230" rx="7"/>
    <path class="head" d="M47 95 H333 Q340 95 340 102 V145 H40 V102 Q40 95 47 95"/>
    <text class="stereo" x="190" y="113" text-anchor="middle">«entity JPA»</text>
    <text class="name" x="190" y="135" text-anchor="middle">User</text>
    <text class="field" x="55" y="169">- id: UUID {PK}</text>
    <text class="field" x="55" y="190">- name: String</text>
    <text class="field" x="55" y="211">- email: String</text>
    <text class="field" x="55" y="232">- password: String {hash}</text>
    <text class="field" x="55" y="253">- role: String</text>
    <text class="field" x="55" y="274">- createdAt: OffsetDateTime</text>
    <text class="field" x="55" y="295">- favoriteDecks: Set&lt;Deck&gt;</text>
    <text class="note" x="55" y="316">role: ROLE_USER | ROLE_ADMIN</text>
  </g>

  <!-- UserPreferences -->
  <g>
    <rect class="box" x="40" y="435" width="300" height="205" rx="7"/>
    <path class="head" d="M47 435 H333 Q340 435 340 442 V485 H40 V442 Q40 435 47 435"/>
    <text class="stereo" x="190" y="453" text-anchor="middle">«entity JPA»</text>
    <text class="name" x="190" y="475" text-anchor="middle">UserPreferences</text>
    <text class="field" x="55" y="509">- userId: UUID {PK, FK}</text>
    <text class="field" x="55" y="530">- dailyGoal: int</text>
    <text class="field" x="55" y="551">- autoplayAudio: boolean</text>
    <text class="field" x="55" y="572">- confirmExit: boolean</text>
    <text class="field" x="55" y="593">- updatedAt: OffsetDateTime</text>
    <text class="note" x="55" y="620">no máximo uma preferência por User</text>
  </g>

  <!-- Favorite -->
  <g>
    <rect class="box assoc" x="430" y="365" width="310" height="190" rx="7"/>
    <path fill="#b95142" d="M437 365 H733 Q740 365 740 372 V415 H430 V372 Q430 365 437 365"/>
    <text class="stereo" x="585" y="383" text-anchor="middle" fill="#ffe9e3">«classe associativa / tabela»</text>
    <text class="name" x="585" y="405" text-anchor="middle">Favorite</text>
    <text class="field" x="445" y="439">- userId: UUID {PK, FK}</text>
    <text class="field" x="445" y="460">- deckId: Long {PK, FK}</text>
    <text class="field" x="445" y="481">- favoritedAt: OffsetDateTime</text>
    <text class="note" x="445" y="509">tabela: user_favorite_decks</text>
    <text class="note" x="445" y="529">mapeada em User via @ManyToMany</text>
    <text class="note" x="445" y="546">não há classe JPA Favorite atualmente</text>
  </g>

  <!-- Deck -->
  <g>
    <rect class="box" x="770" y="95" width="300" height="230" rx="7"/>
    <path class="head" d="M777 95 H1063 Q1070 95 1070 102 V145 H770 V102 Q770 95 777 95"/>
    <text class="stereo" x="920" y="113" text-anchor="middle">«entity JPA»</text>
    <text class="name" x="920" y="135" text-anchor="middle">Deck</text>
    <text class="field" x="785" y="169">- id: Long {PK}</text>
    <text class="field" x="785" y="190">- title: String</text>
    <text class="field" x="785" y="211">- description: String</text>
    <text class="field" x="785" y="232">- language: String</text>
    <text class="field" x="785" y="253">- difficultyLevel: String</text>
    <text class="field" x="785" y="274">- author: User</text>
    <text class="field" x="785" y="295">- createdAt: OffsetDateTime</text>
  </g>

  <!-- Flashcard -->
  <g>
    <rect class="box" x="1200" y="95" width="350" height="390" rx="7"/>
    <path class="head" d="M1207 95 H1543 Q1550 95 1550 102 V145 H1200 V102 Q1200 95 1207 95"/>
    <text class="stereo" x="1375" y="113" text-anchor="middle">«entity JPA»</text>
    <text class="name" x="1375" y="135" text-anchor="middle">Flashcard</text>
    <text class="field" x="1215" y="169">- id: Long {PK}</text>
    <text class="field" x="1215" y="190">- deck: Deck {FK}</text>
    <text class="field" x="1215" y="211">- targetWord: String</text>
    <text class="field" x="1215" y="232">- phoneticReading: String</text>
    <text class="field" x="1215" y="253">- nativeTranslation: String</text>
    <text class="field" x="1215" y="274">- partOfSpeech: String</text>
    <text class="field" x="1215" y="295">- targetSentence: String</text>
    <text class="field" x="1215" y="316">- sentencePhonetic: String</text>
    <text class="field" x="1215" y="337">- sentenceTranslation: String</text>
    <text class="field" x="1215" y="358">- imageData: byte[] {bytea}</text>
    <text class="field" x="1215" y="379">- audioWordData: byte[] {bytea}</text>
    <text class="field" x="1215" y="400">- audioSentenceData: byte[] {bytea}</text>
    <text class="field" x="1215" y="421">- imageMimeType: String</text>
    <text class="field" x="1215" y="442">- createdAt: OffsetDateTime</text>
    <text class="note" x="1215" y="468">Media pode ser nula em criação manual</text>
  </g>

  <!-- StudyProgress -->
  <g>
    <rect class="box" x="600" y="680" width="350" height="275" rx="7"/>
    <path class="head" d="M607 680 H943 Q950 680 950 687 V730 H600 V687 Q600 680 607 680"/>
    <text class="stereo" x="775" y="698" text-anchor="middle">«entity JPA»</text>
    <text class="name" x="775" y="720" text-anchor="middle">StudyProgress</text>
    <text class="field" x="615" y="754">- userId: UUID {PK, FK}</text>
    <text class="field" x="615" y="775">- deckId: Long {PK, FK}</text>
    <text class="field" x="615" y="796">- cardIndex: int</text>
    <text class="field" x="615" y="817">- revealed: boolean</text>
    <text class="field" x="615" y="838">- completed: boolean</text>
    <text class="field" x="615" y="859">- againCount: int</text>
    <text class="field" x="615" y="880">- almostCount: int</text>
    <text class="field" x="615" y="901">- easyCount: int</text>
    <text class="field" x="615" y="922">- updatedAt: OffsetDateTime</text>
    <text class="note" x="615" y="944">chave composta via StudyProgressId</text>
  </g>

  <!-- Relationships -->
  <path class="line" d="M190 325 V435"/>
  <text class="mult" x="200" y="346">1</text>
  <text class="mult" x="200" y="426">0..1</text>
  <text class="label" x="210" y="385">preferences</text>

  <path class="line" d="M340 195 H770"/>
  <text class="mult" x="352" y="187">1</text>
  <text class="mult" x="735" y="187">0..*</text>
  <text class="label" x="535" y="185">author</text>

  <path class="line" d="M340 270 H385 V430 H430"/>
  <text class="mult" x="351" y="262">1</text>
  <text class="mult" x="397" y="421">0..*</text>
  <text class="label" x="348" y="352" transform="rotate(90 348 352)">favorites</text>

  <path class="line" d="M740 430 H920 V325"/>
  <text class="mult" x="750" y="421">0..*</text>
  <text class="mult" x="929" y="346">1</text>
  <text class="label" x="810" y="420">deck favoritado</text>

  <path class="line" d="M1070 195 H1200"/>
  <text class="mult" x="1080" y="187">1</text>
  <text class="mult" x="1166" y="187">0..*</text>
  <text class="label" x="1118" y="218">flashcards</text>

  <path class="line" d="M265 325 V810 H600"/>
  <text class="mult" x="275" y="346">1</text>
  <text class="mult" x="566" y="801">0..*</text>
  <text class="label" x="282" y="620">progress</text>

  <path class="line" d="M920 325 V610 H850 V680"/>
  <text class="mult" x="929" y="346">1</text>
  <text class="mult" x="860" y="672">0..*</text>
  <text class="label" x="930" y="570">progress</text>

  <!-- Legend -->
  <g>
    <rect x="1030" y="735" width="520" height="170" rx="7" fill="#fff" stroke="#b9c4c0"/>
    <text x="1050" y="764" font-size="14" font-weight="700" fill="#315e51">Leitura do modelo</text>
    <text class="note" x="1050" y="792">• Favorite resolve a relação muitos-para-muitos entre User e Deck.</text>
    <text class="note" x="1050" y="815">• Favorite e StudyProgress possuem chaves primárias compostas.</text>
    <text class="note" x="1050" y="838">• {PK}/{FK}: chave primária/estrangeira; {bytea}: binário no PostgreSQL.</text>
    <text class="note" x="1050" y="861">• As associações de StudyProgress existem no banco por FKs; a classe</text>
    <text class="note" x="1062" y="881">Java guarda os identificadores diretamente.</text>
  </g>

  <text x="34" y="982" font-size="11" fill="#71807b">Conferido com entidades JPA e migrations V1–V8 • Karta / ProjetoFlashcards</text>
</svg>
