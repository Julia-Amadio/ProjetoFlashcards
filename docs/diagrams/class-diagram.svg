<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1520 920" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10" fill="none" stroke="#1a1a1a" stroke-width="1.4"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1520" height="920" fill="#ffffff"/>
  <text x="20" y="30" font-size="20" font-weight="700" fill="#1a1a1a">Karta — Diagrama de Classes (modelo de domínio, backend)</text>

  <!-- ===================== User ===================== -->
  <g>
    <rect x="40" y="70" width="270" height="192" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
    <line x1="40" y1="102" x2="310" y2="102" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="175" y="92" text-anchor="middle" font-size="15" font-weight="700">User</text>
    <text x="50" y="120" font-size="12.5">- id: UUID</text>
    <text x="50" y="138" font-size="12.5">- name: String</text>
    <text x="50" y="156" font-size="12.5">- email: String</text>
    <text x="50" y="174" font-size="12.5">- password: String (hash)</text>
    <text x="50" y="192" font-size="12.5">- role: String</text>
    <text x="50" y="210" font-size="12.5">- createdAt: OffsetDateTime</text>
    <text x="50" y="228" font-size="12.5">- favoriteDecks: Set&lt;Deck&gt;</text>
    <text x="50" y="250" font-size="11" fill="#555">«ROLE_USER» ou «ROLE_ADMIN»</text>
  </g>

  <!-- ===================== UserPreferences ===================== -->
  <g>
    <rect x="40" y="340" width="270" height="150" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
    <line x1="40" y1="372" x2="310" y2="372" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="175" y="362" text-anchor="middle" font-size="15" font-weight="700">UserPreferences</text>
    <text x="50" y="390" font-size="12.5">- userId: UUID  «PK, FK»</text>
    <text x="50" y="408" font-size="12.5">- dailyGoal: int</text>
    <text x="50" y="426" font-size="12.5">- autoplayAudio: boolean</text>
    <text x="50" y="444" font-size="12.5">- confirmExit: boolean</text>
    <text x="50" y="462" font-size="12.5">- updatedAt: OffsetDateTime</text>
  </g>

  <!-- ===================== Deck ===================== -->
  <g>
    <rect x="440" y="70" width="270" height="192" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
    <line x1="440" y1="102" x2="710" y2="102" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="575" y="92" text-anchor="middle" font-size="15" font-weight="700">Deck</text>
    <text x="450" y="120" font-size="12.5">- id: Long</text>
    <text x="450" y="138" font-size="12.5">- title: String</text>
    <text x="450" y="156" font-size="12.5">- description: String</text>
    <text x="450" y="174" font-size="12.5">- language: String</text>
    <text x="450" y="192" font-size="12.5">- difficultyLevel: String</text>
    <text x="450" y="210" font-size="12.5">- author: User</text>
    <text x="450" y="228" font-size="12.5">- createdAt: OffsetDateTime</text>
  </g>

  <!-- ===================== StudyProgress ===================== -->
  <g>
    <rect x="440" y="560" width="300" height="260" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
    <line x1="440" y1="592" x2="740" y2="592" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="590" y="582" text-anchor="middle" font-size="15" font-weight="700">StudyProgress</text>
    <text x="450" y="610" font-size="12.5">- userId: UUID  «PK, FK»</text>
    <text x="450" y="628" font-size="12.5">- deckId: Long  «PK, FK»</text>
    <text x="450" y="646" font-size="12.5">- cardIndex: int</text>
    <text x="450" y="664" font-size="12.5">- revealed: boolean</text>
    <text x="450" y="682" font-size="12.5">- completed: boolean</text>
    <text x="450" y="700" font-size="12.5">- againCount: int</text>
    <text x="450" y="718" font-size="12.5">- almostCount: int</text>
    <text x="450" y="736" font-size="12.5">- easyCount: int</text>
    <text x="450" y="754" font-size="12.5">- updatedAt: OffsetDateTime</text>
    <text x="450" y="775" font-size="11" fill="#555">chave composta via @IdClass</text>
    <text x="450" y="790" font-size="11" fill="#555">(StudyProgressId)</text>
  </g>

  <!-- ===================== Flashcard ===================== -->
  <g>
    <rect x="840" y="70" width="320" height="382" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5"/>
    <line x1="840" y1="102" x2="1160" y2="102" stroke="#1a1a1a" stroke-width="1.5"/>
    <text x="1000" y="92" text-anchor="middle" font-size="15" font-weight="700">Flashcard</text>
    <text x="850" y="120" font-size="12.5">- id: Long</text>
    <text x="850" y="138" font-size="12.5">- deck: Deck</text>
    <text x="850" y="156" font-size="12.5">- targetWord: String</text>
    <text x="850" y="174" font-size="12.5">- phoneticReading: String</text>
    <text x="850" y="192" font-size="12.5">- nativeTranslation: String</text>
    <text x="850" y="210" font-size="12.5">- partOfSpeech: String</text>
    <text x="850" y="228" font-size="12.5">- targetSentence: String</text>
    <text x="850" y="246" font-size="12.5">- sentencePhonetic: String</text>
    <text x="850" y="264" font-size="12.5">- sentenceTranslation: String</text>
    <text x="850" y="282" font-size="12.5">- imageData: byte[]  «bytea»</text>
    <text x="850" y="300" font-size="12.5">- audioWordData: byte[]  «bytea»</text>
    <text x="850" y="318" font-size="12.5">- audioSentenceData: byte[]  «bytea»</text>
    <text x="850" y="336" font-size="12.5">- imageMimeType: String</text>
    <text x="850" y="354" font-size="12.5">- createdAt: OffsetDateTime</text>
    <text x="850" y="378" font-size="11" fill="#555">imagem/áudio nulos se o card</text>
    <text x="850" y="393" font-size="11" fill="#555">foi criado manualmente (não via IA)</text>
    <text x="850" y="410" font-size="11" fill="#555">mídia servida via GET /flashcards/&#123;id&#125;/image,</text>
    <text x="850" y="425" font-size="11" fill="#555">.../audio/word, .../audio/sentence</text>
  </g>

  <!-- ===================== Relationships ===================== -->

  <!-- User 1 to 0..1 UserPreferences -->
  <line x1="175" y1="262" x2="175" y2="340" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="182" y="285" font-size="11.5">1</text>
  <text x="182" y="332" font-size="11.5">0..1</text>
  <text x="188" y="305" font-size="12" font-style="italic">preferences</text>

  <!-- Deck N to 1 User (author) -->
  <line x1="440" y1="150" x2="310" y2="150" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="320" y="143" font-size="11.5">1</text>
  <text x="415" y="143" font-size="11.5">0..*</text>
  <text x="340" y="167" font-size="12" font-style="italic">author</text>

  <!-- User 0..* to 0..* Deck (favoriteDecks), curved below author line -->
  <path d="M 175 262 C 175 300, 380 300, 440 200" fill="none" stroke="#1a1a1a" stroke-width="1.3" stroke-dasharray="5,3" marker-end="url(#arrow)"/>
  <text x="195" y="298" font-size="11.5">0..*</text>
  <text x="405" y="215" font-size="11.5">0..*</text>
  <text x="230" y="318" font-size="12" font-style="italic">favoriteDecks (user_favorite_decks)</text>

  <!-- Flashcard 0..* to 1 Deck -->
  <line x1="840" y1="150" x2="710" y2="150" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="720" y="143" font-size="11.5">1</text>
  <text x="808" y="143" font-size="11.5">0..*</text>
  <text x="740" y="167" font-size="12" font-style="italic">deck</text>

  <!-- User 1 to 0..* StudyProgress -->
  <path d="M 200 262 C 200 450, 480 450, 480 560" fill="none" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="207" y="285" font-size="11.5">1</text>
  <text x="450" y="552" font-size="11.5">0..*</text>
  <text x="215" y="440" font-size="12" font-style="italic">progresso do usuário</text>

  <!-- Deck 1 to 0..* StudyProgress -->
  <line x1="590" y1="262" x2="590" y2="560" stroke="#1a1a1a" stroke-width="1.3" marker-end="url(#arrow)"/>
  <text x="597" y="285" font-size="11.5">1</text>
  <text x="597" y="552" font-size="11.5">0..*</text>
  <text x="600" y="420" font-size="12" font-style="italic">progresso por deck</text>

  <!-- ===================== Legend ===================== -->
  <g>
    <rect x="1220" y="600" width="260" height="140" fill="#fafafa" stroke="#999" stroke-width="1"/>
    <text x="1235" y="622" font-size="12.5" font-weight="700">Legenda</text>
    <text x="1235" y="644" font-size="11.5">— linha cheia: associação direta</text>
    <text x="1235" y="662" font-size="11.5">- - linha tracejada: @ManyToMany</text>
    <text x="1235" y="680" font-size="11.5">→ seta: lado que conhece/navega</text>
    <text x="1235" y="698" font-size="11.5">«PK»/«FK»: chave primária/estrangeira</text>
    <text x="1235" y="716" font-size="11.5">«bytea»: coluna binária no Postgres</text>
  </g>

  <text x="20" y="905" font-size="11" fill="#777">Gerado a partir das entidades JPA reais em backend/src/main/java/.../model — Karta, ProjetoFlashcards</text>
</svg>
