#PADRAO ISO-8859-1
#USAR ACENTOS NESSE ARQUIVO PODE IMPEDIR QUE A APLICACAO RODE

spring.application.name=backend

#--- CONFIG NEON DB ---
#Conexao SEMPRE contra o banco Neon (nuvem). Nao existe banco local.
#URL LIMPA: apenas endereco e configs de SSL/channel binding, SEM POOLER (o Spring Boot ja possui o HikariCP).
#Os valores vem do backend/.env (DB_URL, DB_USERNAME, DB_PASSWORD). Sem eles a aplicacao nao sobe -
#vale pro Docker e tambem pra quem rodar direto via 'mvn spring-boot:run' (nesse caso, exporte as vars do Neon).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

#--- CONFIG DRIVER ---
spring.datasource.driver-class-name=org.postgresql.Driver

#--- CONFIG FLYWAY ---
#Ligado: tudo que estiver em db.migration eh executado dentro do BD.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

#--- CONFIG HIBERNATE (JPA) ---
#Verifica se o que existe no BD eh igual ao mapping das entidades dentro do Java
spring.jpa.hibernate.ddl-auto=validate
#Mostra no console todas as queries executadas, desativar se quiser
spring.jpa.show-sql=true
spring.jpa.database=POSTGRESQL

#--- CONFIG JWT ---
#O secret deve ser uma string longa e aleatoria. SEM fallback de proposito: um valor
#publico commitado no repo permitiria forjar token de ROLE_ADMIN caso a env falhe em
#producao. Sem JWT_SECRET configurado, a aplicacao nao sobe - igual DB_URL.
api.security.token.secret=${JWT_SECRET}

#--- CONFIG PYTHON MICROSERVICE ---
app.python-service.url=${PYTHON_SERVICE_URL:http://python-services:8000}
app.internal-secret=${INTERNAL_SECRET:}

#--- CONFIG CORS ---
#Origens liberadas a chamar a API pelo navegador, separadas por virgula.
#Default cobre so o Vite local; em producao, adiciona a URL do Vercel via env var
#CORS_ALLOWED_ORIGINS (nao aqui no arquivo - no painel do Render, aba Environment do backend).
#
# MOLDE pra quando o front tiver URL definitiva no Vercel (descomentar e ajustar o dominio,
# colar como valor da env var CORS_ALLOWED_ORIGINS no Render, NAO aqui):
# CORS_ALLOWED_ORIGINS=https://SEU-PROJETO.vercel.app,http://localhost:5173
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

#--- CONFIG PORTA (deploy) ---
#Plataformas como Render/Railway/Fly.io atribuem a porta dinamicamente via env var PORT.
#Sem essa var (caso local/Docker Compose), cai no padrao 8080 de sempre.
server.port=${PORT:8080}

#--- SWAGGER / OPENAPI ---
#Evita erro 500 com Pageable/Sort do Spring Data
springdoc.model-converters.pageable-converter.enabled=true


#-------- OPCIONAIS: comentar para debugar se necessario --------

#Garante que o Logger do Hibernate fique quieto (apenas erros)
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=ERROR

#Esconder stack trace
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
