server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Mantém frontend e API na mesma origem. A barra final em proxy_pass
    # remove o prefixo /api antes de encaminhar ao Spring.
    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # App.tsx usa rotas do History API; recarregar uma rota interna deve
    # devolver o index da SPA em vez de um 404 do Nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:css|js|ico|png|jpg|jpeg|gif|svg|webp|woff2?)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
