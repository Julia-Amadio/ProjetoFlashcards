services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    container_name: frontend-flashcards
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-5173}:8080"

  backend:
    build: ./backend
    container_name: backend-flashcards
    restart: unless-stopped
    depends_on:
      python-services:
        condition: service_started
    # Credenciais do banco/JWT vêm do backend/.env. O segundo arquivo fornece
    # INTERNAL_SECRET, usado apenas na comunicação interna com o serviço Python.
    env_file:
      - ./backend/.env
      # Compartilha INTERNAL_SECRET com o backend sem duplicar o valor em dois arquivos.
      # PORT é sobrescrita abaixo para não herdar a porta 8000 do serviço Python.
      - ./python-services/.env
    environment:
      PORT: "8080"
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  python-services:
    build: ./python-services
    container_name: python-services-flashcards
    restart: unless-stopped
    env_file:
      - ./python-services/.env
    # O backend acessa este serviço pela rede interna do Compose. Não publicar a
    # porta evita chamadas externas diretas ao endpoint que consome as APIs de IA.
    expose:
      - "8000"
