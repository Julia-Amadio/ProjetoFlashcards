version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: postgres-flashcards
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-flashcards_db}
      POSTGRES_USER: ${DB_USERNAME:-flashcards_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password123}
    ports:
      - "${DB_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-flashcards_admin} -d ${DB_NAME:-flashcards_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: backend-flashcards
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      python-services:
        condition: service_started
    env_file:
      - ./backend/.env
    environment:
      - SPRING_DATASOURCE_URL=${DB_URL:-jdbc:postgresql://postgres:5432/flashcards_db}
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-flashcards_admin}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-password123}
      - API_SECURITY_TOKEN_SECRET=${JWT_SECRET:-minha-chave-secreta}
      - PYTHON_SERVICE_URL=${PYTHON_SERVICE_URL:-http://python-services:8000}
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  python-services:
    build: ./python-services
    container_name: python-services-flashcards
    restart: unless-stopped
    environment:
      - PORT=${PYTHON_PORT:-8000}
    ports:
      - "${PYTHON_PORT:-8000}:8000"

volumes:
  postgres_data:
