services:
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    container_name: frontend-flashcards
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${FRONTEND_PORT:-5173}:8080"

  backend:
    build: ./backend
    container_name: backend-flashcards
    restart: unless-stopped
    depends_on:
      python-services:
        condition: service_started
    # DB_URL, DB_USERNAME, DB_PASSWORD e JWT_SECRET (Neon) vem daqui, injetados no container.
    # O application.properties le essas vars direto - por isso NAO existe bloco 'environment' aqui:
    # 'environment' interpola ${...} a partir de um .env na RAIZ (que nao existe), sobrescrevia
    # esses valores com vazio/default e quebrava a conexao. Fonte unica: backend/.env.
    env_file:
      - ./backend/.env
    ports:
      - "${BACKEND_PORT:-8080}:8080"

  python-services:
    build: ./python-services
    container_name: python-services-flashcards
    restart: unless-stopped
    env_file:
      - ./python-services/.env
    ports:
      - "${PYTHON_PORT:-8000}:8000"
